<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1232 1024" role="img" aria-labelledby="workflow-title workflow-desc">
<title id="workflow-title">sbarframe build, verify and repair workflow</title>
<desc id="workflow-desc">Research and scope lead to an editable system, implementation and actual observations. Failed required checks return through repair and retest. Clear checks permit delivery with documented scope.</desc>
<defs>
<style>
.paper{fill:#f7f6f2}.box{fill:#fff;stroke:#252a32;stroke-width:1.2}.focal{fill:#fff0e8;stroke:#c84c22;stroke-width:1.6}.ink{fill:#252a32}.muted{fill:#4d5868}.label{font:600 20px Geist,Arial,sans-serif;fill:#252a32}.sub{font:16px Geist,Arial,sans-serif;fill:#4d5868}.tag{font:12px 'Geist Mono',monospace;fill:#4d5868;letter-spacing:1px}.title{font:40px 'Instrument Serif',Georgia,serif;fill:#252a32}.edge{fill:none;stroke:#4d5868;stroke-width:1.6;marker-end:url(#workflow-arrow)}
</style>
<marker id="workflow-arrow" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" orient="auto">
<path d="M0 0 L8 4 L0 8 Z" fill="#4d5868"/>
</marker>
</defs>
<rect class="paper" width="1232" height="1024"/>
<text x="64" y="56" class="tag">SBARFRAME / WORKFLOW</text>
<text x="64" y="108" class="title">Build a system. Verify the result.</text>
<path class="edge" d="M304 240 V280"/>
<path class="edge" d="M304 368 V408"/>
<path class="edge" d="M304 496 V536"/>
<path class="edge" d="M304 624 V656"/>
<path class="edge" d="M416 720 H752"/>
<path class="edge" d="M304 784 V832"/>
<path class="edge" d="M80 876 H56 Q48 876 48 868 V580 Q48 572 56 572 H80"/>
<rect x="80" y="152" width="448" height="88" rx="8" class="box"/>
<text x="104" y="188" class="label">01  Research &amp; scope</text>
<text x="104" y="216" class="sub">Audience, verified project, references, rights</text>
<rect x="80" y="280" width="448" height="88" rx="8" class="box"/>
<text x="104" y="316" class="label">02  Define the editable system</text>
<text x="104" y="344" class="sub">Tokens, components, controls, motion map</text>
<rect x="80" y="408" width="448" height="88" rx="8" class="box"/>
<text x="104" y="444" class="label">03  Build in Framer</text>
<text x="104" y="472" class="sub">Native first; code for justified capabilities</text>
<rect x="80" y="536" width="448" height="88" rx="8" class="box"/>
<text x="104" y="572" class="label">04  Observe actual behavior</text>
<text x="104" y="600" class="sub">Responsive, forms, access, SEO, runtime</text>
<path d="M304 656 L416 720 L304 784 L192 720 Z" class="focal"/>
<text x="304" y="716" class="sub" text-anchor="middle">Required checks</text>
<text x="304" y="740" class="label" text-anchor="middle">clear?</text>
<rect x="752" y="676" width="416" height="88" rx="8" class="box"/>
<text x="776" y="712" class="label">06  Deliver &amp; retain lessons</text>
<text x="776" y="740" class="sub">Current guide, evidence and exact scope</text>
<rect x="80" y="832" width="448" height="88" rx="8" class="box"/>
<text x="104" y="868" class="label">05  Repair &amp; retest</text>
<text x="104" y="896" class="sub">Fix the cause; refresh affected evidence</text>
<rect x="560" y="680" width="64" height="28" class="paper"/>
<text x="592" y="700" class="tag" text-anchor="middle">YES</text>
<text x="332" y="816" class="tag">NO</text>
<text x="720" y="200" class="label">A prototype is optional.</text>
<text x="720" y="236" class="sub">Use local HTML or React to resolve</text>
<text x="720" y="264" class="sub">a specific uncertainty, then map it</text>
<text x="720" y="292" class="sub">to editable native components.</text>
<text x="720" y="388" class="label">Three distinct surfaces</text>
<text x="720" y="424" class="sub">Editor: controls and composition</text>
<text x="720" y="452" class="sub">Preview: interactions and navigation</text>
<text x="720" y="480" class="sub">Deployment: exact public artifact</text>
<line x1="64" y1="960" x2="1168" y2="960" stroke="#b7bcc4"/>
<text x="64" y="992" class="sub">Known issues and missing required evidence remain blockers.</text>
</svg>
